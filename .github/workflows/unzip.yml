name: Unzip V2 Final

"on":
workflow_dispatch:

permissions:
contents: write

jobs:
unzip:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract ZIP
    run: |
      set -eu
      ZIP_FILE="crypto-ecosystem-research-v2-final.zip"
      test -f "$ZIP_FILE" || { echo "ZIP not found"; exit 1; }
      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted
      cp -a extracted/. .
      rm -rf extracted

  - name: Commit extracted files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      if ! git diff --cached --quiet; then
        git commit -m "Extract V2 Final project files"
        git push
      fi
