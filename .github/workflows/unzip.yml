name: Unzip V2 Final on: workflow_dispatch:

permissions: contents: write

jobs: unzip: runs-on: ubuntu-latest steps: - name: Checkout repository uses: actions/checkout@v4

- name: Extract ZIP shell: bash run: | set -euo pipefail ZIP_FILE="crypto-ecosystem-research-v2-final.zip" if [ ! -f "$ZIP_FILE" ]; then echo "::error::ZIP file not found: $ZIP_FILE" exit 1 fi mkdir -p /tmp/v2-extracted unzip -q "$ZIP_FILE" -d /tmp/v2-extracted SOURCE="/tmp/v2-extracted" mapfile -t DIRS < <(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d) if [ "${#DIRS[@]}" -eq 1 ] && [ "$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then SOURCE="${DIRS[0]}" fi cp -a "$SOURCE"/. . echo "Extraction completed." - name: Commit extracted files shell: bash run: | set -e git config user.name "github-actions[bot]" git config user.email "41898282+github-actions[bot]@users.noreply.github.com" git add -A if git diff --cached --quiet; then echo "No changes to commit." else git commit -m "Extract V2 Final project files" git push fi 
